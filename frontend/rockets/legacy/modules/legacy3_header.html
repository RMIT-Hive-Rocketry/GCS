<!-- Header visible on all pages -->
<header class="w-full flex flex-row gap-2 h-24 min-h-24 max-h-24 bg-black/50">
    <div class="w-3/10">
        <!-- Logos and project/launch information module -->
        <div
            class="module-legacy flex-row p-2 pl-4 pb-0 justify-evenly items-center gap-4"
        >
            <img
                src="/img/logo-rmit.svg"
                width="163"
                height="58"
                class="max-h-16 w-auto h-auto py-2 px-1"
            />
            <img
                src="/img/logo-hive.256.png"
                width="256"
                height="256"
                class="max-h-20 w-auto h-auto cursor-pointer"
                onclick="window.location.href = '/'"
            />
            <img
                src="/legacy/static/img/logo-legacy3.svg"
                width="418"
                height="51"
                class="w-auto h-auto max-w-48"
            />
        </div>
    </div>
    <nav
        class="navbar w-4/10 h-full grid grid-cols-{{active.PAGES|length}} bg-navbar px-[3%] p-2 gap-2 font-medium text-center items-center text-sm"
    >
        {% for page in active.PAGES %}
        <a href="#{{page['id']}}">
            <div class="icon {{page['icon']}}"></div>
            <span>{{page['name']}}</span>
        </a>
        {% endfor %}
    </nav>
    <div class="w-3/10">
        <!-- Radio module -->
        <div class="module-default p-2 gap-2 justify-center">
            <div class="w-full flex gap-4 justify-start items-center">
                <p class="font-bold text-hive">&nbsp;AV</p>
                <div
                    data-key="state.av.radio"
                    data-type="state"
                    data-timeout='{"3000":4,"10000":5}'
                    class="indicator-state mx-0 timeout"
                ></div>
                <div class="flex flex-row gap-2 grow justify-between">
                    <label>
                        RSSI:<input
                            data-key="meta.av.rssi"
                            data-precision="0"
                            readonly
                            autocomplete="off"
                            class="text-right"
                            size="4"
                        />dBm
                    </label>
                    <label>
                        SNR:<input
                            data-key="meta.av.snr"
                            data-precision="0"
                            readonly
                            autocomplete="off"
                            size="4"
                        />
                    </label>
                    <label>
                        Packets:<input
                            data-key="meta.av.packets"
                            data-precision="0"
                            readonly
                            autocomplete="off"
                            class="text-right"
                            size="11"
                        />
                    </label>
                </div>
            </div>
            <div class="w-full flex gap-4 justify-between items-center">
                <p class="font-bold text-hive">GSE</p>
                <div
                    data-key="state.gse.radio"
                    data-type="state"
                    data-timeout='{"3000":4,"10000":5}'
                    class="indicator-state mx-0 timeout"
                ></div>
                <div class="flex flex-row gap-2 grow justify-between">
                    <label>
                        RSSI:<input
                            data-key="meta.gse.rssi"
                            data-precision="0"
                            readonly
                            autocomplete="off"
                            class="text-right"
                            size="4"
                        />dBm
                    </label>
                    <label>
                        SNR:<input
                            data-key="meta.gse.snr"
                            data-precision="0"
                            readonly
                            autocomplete="off"
                            size="4"
                        />
                    </label>
                    <label>
                        Packets:<input
                            data-key="meta.gse.packets"
                            data-precision="0"
                            readonly
                            autocomplete="off"
                            class="text-right"
                            size="11"
                        />
                    </label>
                </div>
            </div>
        </div>
    </div>
</header>
