<!-- Auxiliary data module (GSE) -->
<!-- Includes transducers, thermocouples, internal temperature, gas bottle weights -->
<div class="module-legacy ml-4 mb-4">
  <h2>Ground service equipment</h2>

  <div class="grid grid-cols-2 grow gap-2 h-full">
    <!-- Transducers -->
    <section class="flex flex-col">
      <h3>Transducer Readings</h3>
      <div class="grow w-full h-full">
        <svg
          id="graph-aux-transducers"
          class="w-full h-full"
          width="0"
          height="0"
        ></svg>
      </div>
      <div class="flex flex-row gap-2 grow justify-evenly text-center">
        <label class="w-1/3">
          N<sub>2</sub>O&nbsp;in:<br /><input
            data-key="bottle_pressure"
            data-precision="1"
            readonly
            autocomplete="off"
            class="border-b-red-500 border-b-2"
            size="5"
          />bar
        </label>
        <label class="w-1/3">
          N<sub>2</sub>O&nbsp;out:<br /><input
            data-key="tank_pressure"
            data-precision="1"
            readonly
            autocomplete="off"
            class="border-b-green-500 border-b-2"
            size="5"
          />bar
        </label>
        <label class="w-1/3">
          O<sub>2</sub>:<br /><input
            data-key="o2_pressure"
            data-precision="1"
            readonly
            autocomplete="off"
            class="border-b-blue-500 border-b-2"
            size="5"
          />bar
        </label>
      </div>
    </section>

    <!-- Thermocouples -->
    <section class="flex flex-col">
      <h3>Thermocouple Readings</h3>
      <div class="grow w-full h-full">
        <svg
          id="graph-aux-thermocouples"
          class="w-full h-full"
          width="0"
          height="0"
        ></svg>
      </div>
      <div class="flex flex-row gap-2 grow justify-evenly text-center">
        <label class="w-1/4">
          N<sub>2</sub>O&nbsp;(int):<br /><input
            data-key="n2o_temp"
            data-precision="0"
            readonly
            autocomplete="off"
            class="border-b-red-500 border-b-2"
            size="4"
          />&deg;C
        </label>
        <label class="w-1/4">
          N<sub>2</sub>O&nbsp;#1:<br /><input
            data-key="rtd_top"
            data-precision="0"
            readonly
            autocomplete="off"
            class="border-b-green-500 border-b-2"
            size="4"
          />&deg;C
        </label>
        <label class="w-1/4">
          N<sub>2</sub>O&nbsp;#2:<br /><input
            data-key="rtd_middle"
            data-precision="0"
            readonly
            autocomplete="off"
            class="border-b-blue-500 border-b-2"
            size="4"
          />&deg;C
        </label>
        <label class="w-1/4">
          O<sub>2</sub>:<br /><input
            data-key="rtd_bottom"
            data-precision="0"
            readonly
            autocomplete="off"
            class="border-b-white border-b-2"
            size="4"
          />&deg;C
        </label>
      </div>
    </section>
  </div>
  <div class="grid grid-cols-2 grow gap-2 h-full">
    <!-- Vent temperature -->
    <section class="flex flex-col">
      <h3>Vent Thermocouple</h3>
      <div class="grow w-full h-full">
        <svg
          id="graph-aux-venttemp"
          class="w-full h-full"
          width="0"
          height="0"
        ></svg>
      </div>
      <label class="w-full text-center">
        Temperature:<input
          data-key="vent_temp"
          data-precision="1"
          readonly
          autocomplete="off"
          class="border-b-red-500 border-b-2"
          size="6"
        />&deg;C
      </label>
    </section>

    <!-- Gas bottle weights -->
    <section class="flex flex-col">
      <h3>Gas-Bottle Masses</h3>
      <div class="grow w-full h-full">
        <svg
          id="graph-aux-gasbottles"
          class="w-full h-full"
          width="0"
          height="0"
        ></svg>
      </div>
      <div class="flex flex-row gap-4 grow justify-evenly">
        <label>
          N<sub>2</sub>O&nbsp;#1:<input
            data-key="gasBottleWeight1"
            data-precision="1"
            readonly
            autocomplete="off"
            class="border-b-red-500 border-b-2"
            size="5"
          />kg
        </label>
        <label>
          N<sub>2</sub>O&nbsp;#2:<input
            data-key="gasBottleWeight2"
            data-precision="1"
            readonly
            autocomplete="off"
            class="border-b-green-500 border-b-2"
            size="5"
          />kg
        </label>
      </div>
    </section>
  </div>

  <!-- Rocket load cell weight -->
  <div class="grid grid-cols-2 gap-2 grow">
    <label class="text-center">
      Rocket Mass:<input
        data-key="rocket_weight"
        data-precision="2"
        readonly
        autocomplete="off"
        size="10"
      />kg
    </label>
    <label class="text-center">
      Rocket Fill Timer:<input
        data-key="gasBottleTime"
        data-type="string"
        readonly
        autocomplete="off"
        class="text-right"
        size="10"
      />
    </label>
  </div>
</div>
