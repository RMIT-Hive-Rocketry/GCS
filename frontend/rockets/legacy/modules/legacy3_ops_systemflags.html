<!-- Auxiliary data module (GSE) -->
<div class="module-legacy">
    <h2>System Flags</h2>

    <div class="grid px-2 gap-2">
        <!-- Flag Indicators -->
        <div
            class="row-span-3 grid grid-rows-8 grid-cols-4 gap-y-2 items-center text-left text-sm"
        >
            <p class="col-span-3">Dual Board Connectivity</p>
            <div class="indicator-state av-state-dualboard"></div>

            <p class="col-span-3">Recovery checks complete and flight ready</p>
            <div class="indicator-state sysflags-state-recovery"></div>

            <p class="col-span-3">GPS Fix</p>
            <div class="indicator-state av-state-gpsfix"></div>

            <p class="col-span-3">Payload Connection</p>
            <div class="indicator-state sysflags-state-payload"></div>

            <p class="col-span-3">Camera Controller</p>
            <div class="indicator-state sysflags-state-camera"></div>

            <p class="col-span-3">Apogee Test</p>
            <div class="indicator-state sysflags-state-apogee"></div>

            <p class="col-span-3">Main/Primary Test</p>
            <div class="indicator-state sysflags-state-main"></div>

            <p class="col-span-3">Broadcast Flag</p>
            <div class="indicator-state sysflags-state-broadcast"></div>
        </div>
    </div>
</div>
