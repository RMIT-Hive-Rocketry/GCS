<!-- 3D rocket module -->
<div class="module-legacy">
    <style>
        .module-legacy .rocket-frame {
            background-image: url("/legacy/img/legacy3/rocket-frame.svg#svgView(preserveAspectRatio(none))");
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        #rocketCanvasLegacy {
            --current-color: var(--color-legacy-medium);
            filter: drop-shadow(1px 1px 0 var(--current-color))
                drop-shadow(-1px 1px 0 var(--current-color))
                drop-shadow(-1px -1px 0 var(--current-color))
                drop-shadow(1px -1px 0 var(--current-color));
        }
    </style>

    <div class="w-full h-full rocket-frame flex flex-col">
        <p class="font-bold uppercase text-legacy text-center mt-4">
            3DOF Rocket Visualisation
        </p>
        <div
            class="flex flex-row gap-4 justify-center text-center text-legacy z-10"
        >
            <span
                >Pitch:<input
                    readonly
                    autocomplete="off"
                    class="rocket-pitch border-b-red-500 border-b-2 text-right"
                    size="6"
                />°</span
            >
            <span
                >Yaw:<input
                    readonly
                    autocomplete="off"
                    class="rocket-yaw border-b-green-500 border-b-2 text-right"
                    size="6"
                />°</span
            >
            <span
                >Roll:<input
                    readonly
                    autocomplete="off"
                    class="rocket-roll border-b-blue-500 border-b-2 text-right"
                    size="6"
                />°</span
            >
        </div>

        <!-- Viewer -->
        <div class="grow flex items-center justify-center h-full">
            <div
                id="rocketContainerLegacy"
                class="relative w-full h-full group"
            >
                <canvas
                    id="rocketCanvasLegacy"
                    class="w-full h-full block"
                ></canvas>
            </div>
        </div>
    </div>

    <!-- 3DOF Rocket code -->
    <script>
        const rocket_containerID = "rocketContainerLegacy";
        const rocket_canvasID = "rocketCanvasLegacy";
        const rocket_model = "/legacy/assets/rocket_legacy3.glb";
    </script>
    <script type="module" src="/legacy/js/legacy3_rocket.js" defer></script>
</div>
