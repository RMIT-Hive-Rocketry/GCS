<!-- Position module for Atlas -->
<!-- Includes altitude, gps -->
<div class="module-atlas">
    <h2>Position</h2>

    <!-- GPS -->
    <section class="p-0 w-full flex flex-row gap-2 justify-evenly text-sm">
        <label>
            Latitude:<input
                data-key="data.GPSLatitude"
                data-precision="6"
                readonly
                autocomplete="off"
                size="11"
            />deg
        </label>
        <label>
            Longitude:<input
                data-key="data.GPSLongitude"
                data-precision="6"
                readonly
                autocomplete="off"
                size="11"
            />deg
        </label>
        <label
            >Nav State:<input
                data-key="data.navigationStatus"
                data-type="string"
                readonly
                autocomplete="off"
                size="3"
        /></label>
    </section>

    <!-- Altitude -->
    <section class="h-full flex flex-col grow p-0">
        <h3>Altitude</h3>
        <div class="grow w-full h-full">
            <svg
                id="graph-pos-alt"
                class="w-full h-full"
                width="0"
                height="0"
            ></svg>
        </div>
        <div class="flex gap-4 items-center px-2 justify-evenly text-sm">
            <label
                >Current Altitude:&nbsp;<input
                    data-key="data.altitudeFeet"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    class="border-b-red-500 border-b-2"
                    size="10"
                />ft&nbsp;&nbsp;<input
                    data-key="data.altitude"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    size="10"
                />m</label
            >
        </div>
        <div class="flex gap-4 items-center px-2 justify-evenly font-bold">
            <label
                >&nbsp;&nbsp;&nbsp;&nbsp;Max Altitude:&nbsp;<input
                    data-key="data.altitudeMaxFeet"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    size="10"
                />ft&nbsp;&nbsp;<input
                    data-key="data.altitudeMax"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    size="10"
                />m</label
            >
        </div>
    </section>
</div>
