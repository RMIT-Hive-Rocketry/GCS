<!-- Flight state module -->
<!-- Includes time, flight state indicator -->
<div class="module-atlas justify-center px-2">
    <h2>Launch Timeline</h2>
    <div
        class="border-y-2 border-hive-dark text-center bg-hive/20 grid grid-cols-6 p-4 pb-2 gap-y-2 items-center justify-center z-50"
        style="grid-auto-rows: max-content"
    >
        <div class="hidden indicator-flightstate active"></div>
        <div class="indicator-flightstate fs-state-preflight">
            <div class="indicator-state"></div>
        </div>
        <div class="indicator-flightstate fs-state-launch">
            <div class="indicator-state"></div>
        </div>
        <div class="indicator-flightstate fs-state-coast">
            <div class="indicator-state"></div>
        </div>
        <div class="indicator-flightstate fs-state-apogee">
            <div class="indicator-state"></div>
        </div>
        <div class="indicator-flightstate fs-state-descent">
            <div class="indicator-state"></div>
        </div>
        <div class="indicator-flightstate fs-state-landed">
            <div class="indicator-state"></div>
        </div>
        <p>PRE-FLIGHT</p>
        <p>LAUNCH</p>
        <p>COAST</p>
        <p>APOGEE</p>
        <p>DESCENT</p>
        <p>LANDED</p>
    </div>
    <div class="grid grid-cols-3 gap-4">
        <p class="flex gap-1 justify-center items-center grow">
            <span>Flight State:</span>
            <input
                readonly
                autocomplete="off"
                class="fs-flightstate text-center text-base"
            />
        </p>
        <p class="flex gap-1 justify-center items-center grow">
            <span>Fight Time:</span>
            <input
                data-key="launchTime"
                data-type="string"
                readonly
                autocomplete="off"
                class="text-center max-w-32"
                size="12"
            />
        </p>
        <p class="flex gap-1 justify-center items-center">
            <span>System Uptime:</span>
            <input
                data-key="localTime"
                data-type="string"
                readonly
                autocomplete="off"
                class="text-right max-w-32"
                size="12"
            />
        </p>
    </div>
</div>
