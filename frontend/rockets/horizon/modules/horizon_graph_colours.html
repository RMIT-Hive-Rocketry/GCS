<!-- Graph colour selector -->
<div class="module-horizon">
  <h2>Graph colour selectors</h2>
    <form>
      <label for="colourOne">Select your desired graph colours:</label>
      <input type="color" id="colourOne" name="colourOne" value="#ff0000">
      <label for="colourTwo"></label>
      <input type="color" id="colourTwo" name="colourTwo" value="#00ff00">
      <label for="colourThree"></label>
      <input type="color" id="colourThree" name="colourThree" value="#0000ff">
      <label for="colourFour"></label>
      <input type="color" id="colourFour" name="colourFour" value="#ffffff">
    </form>

    <h3>Sample graph</h3>
    <div class="grow w-full h-full">
      <svg
          id="graph-test-colours"
          class="w-full h-full"
          width="0"
          height="0"
      ></svg>
    </div>
</div>
