        <!-- =================================================================
            HMI JAVASCRIPT
            Handles live data updates for pressures, temperatures, solenoids.
            ================================================================= -->
        <script>
    
            // ---------------------------------------------------------------
            // Colour palettes
            // ---------------------------------------------------------------
    
            // Three-state colour: red | green | yellow
            const color = ["#FF0000", "#00FF4D", "#FFF600"];
    
            // Two-state colour for valves: red = closed, green = open
            const colorBoolean = ["#FF0000", "#00FF4D"];
    
    
            // ---------------------------------------------------------------
            // changecolor(objectid)
            // Toggles a valve element between open (green) and closed (red).
            // Called by onclick handlers on the overlay rectangles.
            // ---------------------------------------------------------------
            function changecolor(objectid) {
                const elem = document.getElementById(objectid);
                if (elem == undefined) return;
    
                const fill    = elem.getAttribute("fill");
                const isGreen = fill == colorBoolean[1];
                const newFill = isGreen ? colorBoolean[0] : colorBoolean[1];
    
                elem.setAttribute("fill", newFill);
            }
    
    
            // ---------------------------------------------------------------
            // statusBarUpdate(data)
            // Refreshes the four status bar fields from live telemetry.
            //   - Rocket Fill Timer: read from hidden gasBottleTime input
            //   - N₂O In pressure:   data.pressure_n2o_bottle (bar)
            //   - O₂ pressure:       data.pressure_n2o_tank (bar)
            //   - Last Update:       timestamp of most recent telemetry packet (local time)
            //   - Date:              browser Date (set once, refreshes at
            //                        midnight via setInterval)
            // ---------------------------------------------------------------
            function statusBarUpdate(data) {
    
                // Rocket Fill Timer — pull from the hidden data-key input
                const timerInput = document.getElementById(
                    "gasBottleTime-input"
                );
                const timerEl = document.getElementById("sb-fill-timer");
                if (timerEl && timerInput) {
                    timerEl.textContent = timerInput.value || "--";
                }
    
                // N₂O In pressure
                const n2oEl = document.getElementById("sb-n2o-in");
                if (n2oEl && data?.pressure_n2o_bottle != undefined) {
                    n2oEl.textContent =
                        Number(data.pressure_n2o_bottle).toFixed(1) + " bar";
                }
    
                // O₂ pressure
                const o2El = document.getElementById("sb-o2");
                if (o2El && data?.pressure_n2o_tank != undefined) {
                    o2El.textContent =
                        Number(data.pressure_n2o_tank).toFixed(1) + " bar";
                }
            }
    
            // ---------------------------------------------------------------
            // statusBarSetDate()
            // Writes today's date (YYYY-MM-DD) into the status bar.
            // Called once on load and then every minute to catch midnight.
            // ---------------------------------------------------------------
            function statusBarSetDate() {
                const el = document.getElementById("sb-date");
                if (!el) return;
                const now = new Date();
                const yyyy = now.getFullYear();
                const mm   = String(now.getMonth() + 1).padStart(2, "0");
                const dd   = String(now.getDate()).padStart(2, "0");
                el.textContent = yyyy + "-" + mm + "-" + dd;
            }
    
            // Initialise date immediately and refresh every 60 seconds
            statusBarSetDate();
            setInterval(statusBarSetDate, 60000);
    
    
            // ---------------------------------------------------------------
            // hmiUpdate(data)
            // Entry point for live telemetry. Accepts a data object with
            // transducer, thermocouple, and stateFlag fields.
            // ---------------------------------------------------------------
            function hmiUpdate(data) {
    
                // Pressure transducers (bar)
                if (data?.pressure_n2o_bottle) {
                    // N2O in pressure
                    hmiUpdateValue("hmi-pressure-1", data.pressure_n2o_bottle);
                }
                if (data?.pressure_n2o_tank) {
                    // N2O out pressure
                    hmiUpdateValue("hmi-pressure-2", data.pressure_n2o_tank);
                }
                if (data?.pressure_n2o_tank) {
                    // O2 pressure
                    hmiUpdateValue("hmi-pressure-3", data.pressure_n2o_tank);
                }
    
                // Thermocouples (°C)
                if (data?.temp_pipe_n2o_gse) {
                    // N2O internal temperature
                    hmiUpdateValue("HMI_N2O-INTTEMP", data.temp_pipe_n2o_gse);
                }
                if (data?.thermocouple2) {
                    // N2O bottle #1 temperature
                    hmiUpdateValue("HMI_N2O-1TEMP", data.thermocouple2);
                }
                if (data?.thermocouple3) {
                    // N2O bottle #2 temperature
                    hmiUpdateValue("HMI_N2O-2TEMP", data.thermocouple3);
                }
                if (data?.thermocouple4) {
                    // O2 bottle temperature
                    hmiUpdateValue("HMI_O2TEMP", data.thermocouple4);
                }

                // Flight tank thermocouples (°C) — top, middle, bottom
                // Use !== undefined so a legitimate 0 °C reading isn't skipped
                if (data?.temp_tank_top !== undefined) {
                    hmiUpdateValue("HMI_TANK_TOP_TEMP", data.temp_tank_top);
                }
                if (data?.temp_tank_middle !== undefined) {
                    hmiUpdateValue("HMI_TANK_MIDDLE_TEMP", data.temp_tank_middle);
                }
                if (data?.temp_tank_bottom !== undefined) {
                    hmiUpdateValue("HMI_TANK_BOTTOM_TEMP", data.temp_tank_bottom);
                }
    
                // Solenoid valve states (boolean flags)
                if (data?.stateFlags) {
                    hmiUpdateSolenoid(
                        "solenoidsV5",
                        data.stateFlags.n20FillActivated
                    );
                    hmiUpdateSolenoid(
                        "solenoidsV6",
                        data.stateFlags.o2FillActivated
                    );
                    // V7 is normally open; flag inverts meaning
                    hmiUpdateSolenoid(
                        "solenoidsV7",
                        data.stateFlags.manualPurgeActivated
                    );
                }
    
                // Refresh status bar with latest telemetry values
                statusBarUpdate(data);

                // Last Update — timestamp of most recent telemetry packet
                const lastUpdateEl = document.getElementById("sb-last-update");
                if (lastUpdateEl) {
                    const now = new Date();
                    const hh = String(now.getHours()).padStart(2, "0");
                    const mm = String(now.getMinutes()).padStart(2, "0");
                    const ss = String(now.getSeconds()).padStart(2, "0");
                    lastUpdateEl.textContent = hh + ":" + mm + ":" + ss;
                }
            }
    
    
            // ---------------------------------------------------------------
            // hmiUpdateValue(id, value)
            // Updates a text element's first child with value.toFixed(1).
            // Also triggers gauge bar update for temperature elements.
            // ---------------------------------------------------------------
            function hmiUpdateValue(id, value) {
                if (value == undefined || Number.isNaN(value)) return;
    
                const elem = document.getElementById(id).firstElementChild;
                if (!elem) return;
    
                elem.innerHTML = value.toFixed(1);
    
                // Gauge bar updates are only needed for bottle temperatures
                if (id == "HMI_N2O-1TEMP") {
                    hmiUpdateTemperature("gauge_1_fill", value, "gauge_1_bar");
                } else if (id == "HMI_N2O-2TEMP") {
                    hmiUpdateTemperature("gauge_2_fill", value, "gauge_2_bar");
                } else if (id == "HMI_O2TEMP") {
                    hmiUpdateTemperature("gauge_3_fill", value, "gauge_3_bar");
                }
            }
    
    
            // ---------------------------------------------------------------
            // hmiUpdateTemperature(fillId, value, barId)
            // Sets fill colour based on temperature bands and adjusts the
            // white overlay bar height to represent the current reading.
            //
            //   < 15°C  → green  (cold / safe fill temp)
            //   15–25°C → yellow (nominal)
            //   > 25°C  → red    (too warm)
            //
            // Bar height maps 0–36°C linearly onto 0–69 px.
            // ---------------------------------------------------------------
            function hmiUpdateTemperature(fillId, value, barId) {
                const gauge    = document.getElementById(fillId);
                const gaugeBar = document.getElementById(barId);
                if (!gauge) return;
    
                // Colour band logic
                if (value < 15) {
                    gauge.setAttribute("fill", color[1]);      // green
                } else if (value <= 25) {
                    gauge.setAttribute("fill", color[2]);      // yellow
                } else {
                    gauge.setAttribute("fill", color[0]);      // red
                }
    
                // Bar height: full when cold, empty when hot
                const MAX_HEIGHT = 69;
                const TEMP_MAX   = 36;
                let barHeight;
    
                if (value < 0) {
                    barHeight = MAX_HEIGHT;
                } else if (value > TEMP_MAX) {
                    barHeight = 0;
                } else {
                    barHeight = MAX_HEIGHT - (value / TEMP_MAX) * MAX_HEIGHT;
                }
    
                gaugeBar.setAttribute("height", barHeight);
            }
    
    
            // ---------------------------------------------------------------
            // hmiUpdateSolenoid(id, state)
            // Sets a solenoid element's fill to green (true) or red (false).
            // ---------------------------------------------------------------
            function hmiUpdateSolenoid(id, state) {
                if (state == undefined)        return;
                if (typeof state !== "boolean") return;
    
                const solenoid = document.getElementById(id);
                if (!solenoid) return;
    
                solenoid.setAttribute("fill", colorBoolean[state ? 1 : 0]);
            }
    
        </script>
    
    </div>
