<style>
    /* Invisible table */
    table.invisible-table, 
    table.invisible-table th, 
    table.invisible-table td {
        border: none;
        border-collapse: collapse;

    /* Create a gap every 2nd row (1st row is device

    */

        border-bottom: 5px solid transparent;

</style>
