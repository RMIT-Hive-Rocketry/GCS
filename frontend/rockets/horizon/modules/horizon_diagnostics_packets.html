<!-- LEFT: Device list sidebar -->
<div class="module-horizon w-full h-full flex flex-col p-2 gap-2 overflow-hidden">
    <div class="flex items-baseline gap-3 shrink-0">
        <h2>DEVICES</h2>
    </div>

    <!-- AV radio -->
<div
id="diag-av-card"
class="flex flex-col px-3 py-2 rounded-xl gap-1 shrink-0"
style="
    background:linear-gradient(180deg, rgba(12,12,16,0.9), rgba(4,4,8,0.9));
    border:1px solid rgba(255,45,105,0.65);
    box-shadow:0 0 8px rgba(255,45,105,0.15);
"
>
<div class="flex items-center gap-2 mb-1">
    <div
        id="diag-av-indicator"
        style="
            width:10px;
            height:10px;
            border-radius:50%;
            flex-shrink:0;
            background:#ef4444;
            box-shadow:0 0 6px #ef4444;
        "
    ></div>
    <span
        class="font-bold"
        style="color:var(--color-horizon-yellow,#f59e0b); font-size:0.95rem;"
    >AV</span>
</div>

<div
    style="
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 4px;
    "
>
    <div style="display:flex; flex-direction:column; gap:2px;">
        <span style="font-size:0.65rem; color:rgba(255,255,255,0.45);">RSSI</span>
        <input
            data-key="meta.av.rssi"
            data-precision="0"
            readonly
            autocomplete="off"
            class="bg-transparent border-0 outline-none p-0"
            style="font-size:0.9rem; color:rgba(255,255,255,0.85); width:100%;"
        />
    </div>

    <div style="display:flex; flex-direction:column; gap:2px;">
        <span style="font-size:0.65rem; color:rgba(255,255,255,0.45);">SNR</span>
        <input
            data-key="meta.av.snr"
            data-precision="0"
            readonly
            autocomplete="off"
            class="bg-transparent border-0 outline-none p-0"
            style="font-size:0.9rem; color:rgba(255,255,255,0.85); width:100%;"
        />
    </div>

    <div style="display:flex; flex-direction:column; gap:2px;">
        <span style="font-size:0.65rem; color:rgba(255,255,255,0.45);">Packets</span>
        <input
            data-key="meta.av.packets"
            data-precision="0"
            readonly
            autocomplete="off"
            class="bg-transparent border-0 outline-none p-0"
            style="font-size:0.9rem; color:rgba(255,255,255,0.85); width:100%;"
        />
    </div>
</div>
</div>

    <!-- Dynamic device cards -->
    <div id="diag-device-list" class="flex-1 flex flex-col gap-2 overflow-y-auto min-h-0">
    </div>

    <!-- Last updated -->
    <p id="diag-last-updated" class="text-sm text-center font-semibold shrink-0"
       style="color:var(--color-horizon-yellow,#f59e0b);">Last updated: --</p>
</div>
