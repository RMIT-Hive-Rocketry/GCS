<div class="module-horizon p-2 gap-2 justify-center">
    Existing AV device
    <div class="w-full flex gap-4 justify-start items-center">
        <p class="font-bold text-hive">&nbsp;AV</p>
        <div
            data-key="state.av.radio"
            data-type="state"
            class="indicator-state mx-0 timeout"
        ></div>
        <div class="flex flex-row gap-2 grow justify-between">
            <label>
                Packet Loss:<input
                    data-key="meta.av.packet-loss"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    class="text-right"
                    size="4"
                />
            </label>
            <label>
                Ping:<input
                    data-key="meta.av.ping"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    size="4"
                />
            </label>
            <label>
                Packets:<input
                    data-key="meta.av.packets"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    class="text-right"
                    size="11"
                />
            </label>
        </div>
    </div></br>
