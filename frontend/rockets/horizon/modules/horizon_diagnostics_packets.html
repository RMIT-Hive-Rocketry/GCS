    <!-- Existing AV device (same attributes as the top)-->
    <tr>
        <td class="w-full flex gap-4 justify-start items-center">
            <div
                data-key="state.av.radio"
                data-type="state"
                class="indicator-state mx-0 timeout"
            ></div>
            <span class="font-bold text-hive">AV</span>
        </td>
    </tr>
    <tr style="border-bottom: 30px solid transparent;">
        <td>
            <label>
                RSSI:<input
                    data-key="meta.av.rssi"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    class="text-right"
                    size="4"
                />dBm
            </label>
        </td>
        <td>
            <label>
                SNR:<input
                    data-key="meta.av.snr"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    size="4"
                />
            </label>
        </td>
        <td>
            <label>

                    data-key="meta.av.packets"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    class="text-right"
                    size="11"
                />
            </label>

    </tr>
