<!-- Radio module -->
<!-- AV on top, GSE below; each row is a flat flex: label → indicator → readings -->
<div class="module-horizon p-2 gap-2 justify-center">
    <div class="w-full flex gap-4 justify-start items-center">
        <p class="font-bold text-hive">&nbsp;AV</p>
        <div
            data-key="state.av.radio"
            data-type="state"
            class="indicator-state mx-0 timeout"
        ></div>
        <div class="flex flex-row gap-2 grow justify-between">
            <label>
                RSSI:<input
                    data-key="meta.av.rssi"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    class="text-right"
                    size="4"
                />dBm
            </label>
            <label>
                SNR:<input
                    data-key="meta.av.snr"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    size="4"
                />
            </label>
            <label>
                Packets:<input
                    data-key="meta.av.packets"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    class="text-right"
                    size="11"
                />
            </label>
        </div>
    </div>
    <div class="w-full flex gap-4 justify-between items-center">
        <p class="font-bold text-hive">GSE</p>
        <div
            data-key="state.gse.radio"
            data-type="state"
            class="indicator-state mx-0 timeout"
        ></div>
        <div class="flex flex-row gap-2 grow justify-between">
            <label>
                RSSI:<input
                    data-key="meta.gse.rssi"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    class="text-right"
                    size="4"
                />dBm
            </label>
            <label>
                SNR:<input
                    data-key="meta.gse.snr"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    size="4"
                />
            </label>
            <label>
                Packets:<input
                    data-key="meta.gse.packets"
                    data-precision="0"
                    readonly
                    autocomplete="off"
                    class="text-right"
                    size="11"
                />
            </label>
        </div>
    </div>
</div>
