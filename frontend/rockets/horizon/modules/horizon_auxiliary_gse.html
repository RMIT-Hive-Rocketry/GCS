<!-- Auxiliary data module (GSE) -->
<!-- Includes transducers, thermocouples, internal temperature, gas bottle weights -->
<div class="module-horizon">
    <h2>Ground Support Equipment</h2>

    <div class="grid grid-cols-2 grow gap-2 h-full">
        <!-- Transducers -->
        <section class="flex flex-col">
            <h3>Transducer Readings</h3>
            <div class="grow w-full h-full">
                <svg id="graph-aux-transducers" class="w-full h-full" width="0" height="0"></svg>
            </div>
            <div class="flex flex-row gap-2 grow justify-evenly text-center">
                <label class="w-1/3">
                    N<sub>2</sub>O&nbsp;Supply:<br /><input data-key="bottle_pressure" data-precision="1" readonly
                        autocomplete="off" style="border-bottom: 2px solid #FF0000" size="5" />bar
                </label>
                <label class="w-1/3">
                    N<sub>2</sub>O&nbsp;Feed:<br /><input data-key="tank_pressure" data-precision="1" readonly
                        autocomplete="off" style="border-bottom: 2px solid #00FF00" size="5" />bar
                </label>
                <label class="w-1/3">
                    O<sub>2</sub>&nbsp;Supply:<br /><input data-key="o2_pressure" data-precision="1" readonly
                        autocomplete="off" style="border-bottom: 2px solid #0000FF" size="5" />bar
                </label>
            </div>
        </section>

        <!-- Thermocouples -->
        <section class="flex flex-col">
            <h3>Flight Tank Temperature</h3>
            <div class="grow w-full h-full">
                <svg id="graph-aux-thermocouples" class="w-full h-full" width="0" height="0"></svg>
            </div>
            <div class="flex flex-row gap-2 grow justify-evenly text-center">
                <label class="w-1/4">
                    Top Tank<br /><input data-key="rtd_top" data-precision="0" readonly autocomplete="off"
                        style="border-bottom: 2px solid #ff0000" size="4" />&deg;C
                </label>
                <label class="w-1/4">
                    Mid Tank<br /><input data-key="rtd_middle" data-precision="0" readonly autocomplete="off"
                        style="border-bottom: 2px solid #00FF00" size="4" />&deg;C
                </label>
                <label class="w-1/4">
                    Bot Tank<input data-key="rtd_bottom" data-precision="0" readonly autocomplete="off"
                        style="border-bottom: 2px solid #0000FF" size="4" />&deg;C
                </label>
            </div>
        </section>
    </div>
    <div class="grid grid-cols-2 grow gap-2 h-full">
        <!-- Vent temperature -->
        <section class="flex flex-col">
            <h3>Vent Thermocouple</h3>
            <div class="grow w-full h-full">
                <svg id="graph-aux-venttemp" class="w-full h-full" width="0" height="0"></svg>
            </div>
            <label class="w-full text-center">
                Temperature:<input data-key="vent_temp" data-precision="1" readonly autocomplete="off"
                    style="border-bottom: 2px solid #FF0000" size="6" />&deg;C
            </label>
        </section>

        <!-- N2O Supply Temperature -->
        <section class="flex flex-col">
            <h3>N<sub>2</sub>O Supply Temperature</h3>
            <div class="grow w-full h-full">
                <svg id="graph-aux-n2o-supply-temp" class="w-full h-full" width="0" height="0"></svg>
            </div>
            <div class="flex flex-row gap-4 grow justify-evenly">
                <label>
                    Temperature<input data-key="n2o_temp" data-precision="1" readonly autocomplete="off"
                        style="border-bottom: 2px solid #ff0000" size="5" />&deg;C
                </label>
            </div>
        </section>
    </div>

    <!-- Rocket load cell weight -->
    <div class="grid grid-cols-2 gap-2 grow">
        <label class="text-center">
            Rocket Mass:<input data-key="rocket_weight_tare" data-precision="2" readonly autocomplete="off"
                size="10" />kg
        </label>
        <label class="text-center">
            Rocket Fill Timer:<input data-key="gasBottleTime" data-type="string" readonly autocomplete="off"
                class="text-right" size="10" />
        </label>
    </div>
</div>
