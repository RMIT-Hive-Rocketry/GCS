<!-- Auxiliary data module (GSE) -->
<!-- Includes transducers, thermocouples, internal temperature, gas bottle weights -->
<div class="module-horizon">
    <h2>Auxiliary (GSE)</h2>

    <div class="grid grid-cols-2 grow gap-2 h-full">
        <!-- Transducers -->
        <section class="flex flex-col">
            <h3>Transducer Readings</h3>
            <div class="grow w-full h-full">
                <svg
                    id="graph-aux-transducers"
                    class="w-full h-full"
                    width="0"
                    height="0"
                ></svg>
            </div>
            <div class="flex flex-row gap-2 grow justify-evenly text-center">
                <label class="w-1/3">
                    N<sub>2</sub>O&nbsp;in:<br /><input
                        data-key="pressure_n2o_bottle"
                        data-precision="1"
                        readonly
                        autocomplete="off"
                        style="border-bottom: 2px solid #FF0000"
                        size="5"
                    />bar
                </label>
                <label class="w-1/3">
                    N<sub>2</sub>O&nbsp;out:<br /><input
                        data-key="pressure_n2o_tank"
                        data-precision="1"
                        readonly
                        autocomplete="off"
                        style="border-bottom: 2px solid #00FF00"
                        size="5"
                    />bar
                </label>
                <label class="w-1/3">
                    O<sub>2</sub>:<br /><input
                        data-key="pressure_o2_tank"
                        data-precision="1"
                        readonly
                        autocomplete="off"
                        style="border-bottom: 2px solid #0000FF"
                        size="5"
                    />bar
                </label>
            </div>
        </section>

        <!-- Thermocouples -->
        <section class="flex flex-col">
            <h3>Thermocouple Readings</h3>
            <div class="grow w-full h-full">
                <svg
                    id="graph-aux-thermocouples"
                    class="w-full h-full"
                    width="0"
                    height="0"
                ></svg>
            </div>
            <div class="flex flex-row gap-2 grow justify-evenly text-center">
                <label class="w-1/4">
                    N<sub>2</sub>O&nbsp;(int):<br /><input
                        data-key="temp_pipe_n2o_gse"
                        data-precision="0"
                        readonly
                        autocomplete="off"
                        style="border-bottom: 2px solid #FF0000"
                        size="4"
                    />&deg;C
                </label>
                <label class="w-1/4">
                    Top RTD<br /><input
                        data-key="temp_tank_top"
                        data-precision="0"
                        readonly
                        autocomplete="off"
                        style="border-bottom: 2px solid #00FF00"
                        size="4"
                    />&deg;C
                </label>
                <label class="w-1/4">
                    Mid RTD<br /><input
                        data-key="temp_tank_middle"
                        data-precision="0"
                        readonly
                        autocomplete="off"
                        style="border-bottom: 2px solid #0000FF"
                        size="4"
                    />&deg;C
                </label>
                <label class="w-1/4">
                    Bottom RTD /><input
                        data-key="temp_tank_bottom"
                        data-precision="0"
                        readonly
                        autocomplete="off"
                        style="border-bottom: 2px solid #FFFFFF"
                        size="4"
                    />&deg;C
                </label>
            </div>
        </section>
    </div>
    <div class="grid grid-cols-2 grow gap-2 h-full">
        <!-- Vent temperature -->
        <section class="flex flex-col">
            <h3>Vent Thermocouple</h3>
            <div class="grow w-full h-full">
                <svg
                    id="graph-aux-venttemp"
                    class="w-full h-full"
                    width="0"
                    height="0"
                ></svg>
            </div>
            <label class="w-full text-center">
                Temperature:<input
                    data-key="temp_vent"
                    data-precision="1"
                    readonly
                    autocomplete="off"
                    style="border-bottom: 2px solid #FF0000"
                    size="6"
                />&deg;C
            </label>
        </section>

        <!-- Gas bottle weights -->
        <section class="flex flex-col">
            <h3>Gas-Bottle Masses</h3>
            <div class="grow w-full h-full">
                <svg
                    id="graph-aux-gasbottles"
                    class="w-full h-full"
                    width="0"
                    height="0"
                ></svg>
            </div>
            <div class="flex flex-row gap-4 grow justify-evenly">
                <label>
                    N<sub>2</sub>O&nbsp;#1:<input
                        data-key="gasBottleWeight1"
                        data-precision="1"
                        readonly
                        autocomplete="off"
                        style="border-bottom: 2px solid #FF0000"
                        size="5"
                    />kg
                </label>
                <label>
                    N<sub>2</sub>O&nbsp;#2:<input
                        data-key="gasBottleWeight2"
                        data-precision="1"
                        readonly
                        autocomplete="off"
                        style="border-bottom: 2px solid #00FF00"
                        size="5"
                    />kg
                </label>
            </div>
        </section>
    </div>

    <!-- Rocket load cell weight -->
    <div class="grid grid-cols-2 gap-2 grow">
        <label class="text-center">
            Rocket Mass:<input
                data-key="weight_rocket"
                data-precision="2"
                readonly
                autocomplete="off"
                size="10"
            />kg
        </label>
        <label class="text-center">
            Rocket Fill Timer:<input
                data-key="gasBottleTime"
                data-type="string"
                readonly
                autocomplete="off"
                class="text-right"
                size="10"
            />
        </label>
    </div>
</div>
