<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="630" height="700" viewBox="0 0 630 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Signal strength bars: ascending left side -->
  <g fill="#f63356">
    <rect x="10" y="580" width="5" height="40" opacity="0.4"/>
    <rect x="20" y="560" width="5" height="60" opacity="0.5"/>
    <rect x="30" y="530" width="5" height="90" opacity="0.6"/>
    <rect x="40" y="490" width="5" height="130" opacity="0.7"/>
    <rect x="50" y="440" width="5" height="180" opacity="0.8"/>
  </g>

  <!-- Signal strength bars: mirrored right side -->
  <g fill="#f63356">
    <rect x="615" y="580" width="5" height="40" opacity="0.4"/>
    <rect x="605" y="560" width="5" height="60" opacity="0.5"/>
    <rect x="595" y="530" width="5" height="90" opacity="0.6"/>
    <rect x="585" y="490" width="5" height="130" opacity="0.7"/>
    <rect x="575" y="440" width="5" height="180" opacity="0.8"/>
  </g>

  <!-- Primary sine wave -->
  <path d="M 0 670 Q 52.5 630, 105 670 T 210 670 T 315 670 T 420 670 T 525 670 T 630 670"
        stroke="#ffd931" stroke-width="2" fill="none" opacity="0.9"/>

  <!-- Secondary offset wave -->
  <path d="M 0 680 Q 52.5 700, 105 680 T 210 680 T 315 680 T 420 680 T 525 680 T 630 680"
        stroke="#f63356" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Baseline -->
  <line x1="0" y1="695" x2="630" y2="695" stroke="#9e193c" stroke-width="1.5" opacity="0.5"/>

  <!-- Baseline tick marks -->
  <g stroke="#9e193c" stroke-width="1" opacity="0.4">
    <line x1="52" y1="692" x2="52" y2="698"/>
    <line x1="157" y1="692" x2="157" y2="698"/>
    <line x1="262" y1="692" x2="262" y2="698"/>
    <line x1="367" y1="692" x2="367" y2="698"/>
    <line x1="472" y1="692" x2="472" y2="698"/>
    <line x1="577" y1="692" x2="577" y2="698"/>
  </g>
</svg>
