<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="630" height="700" viewBox="0 0 630 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left gantry main rails (double structure) -->
  <line x1="20" y1="80" x2="20" y2="660" stroke="#f63356" stroke-width="2"/>
  <line x1="35" y1="80" x2="35" y2="660" stroke="#9e193c" stroke-width="1.5" opacity="0.7"/>

  <!-- Right gantry main rails -->
  <line x1="610" y1="80" x2="610" y2="660" stroke="#f63356" stroke-width="2"/>
  <line x1="595" y1="80" x2="595" y2="660" stroke="#9e193c" stroke-width="1.5" opacity="0.7"/>

  <!-- Left gantry cross-bracing (zigzag diagonals) -->
  <g stroke="#ffd931" stroke-width="1.5" opacity="0.6">
    <line x1="20" y1="150" x2="35" y2="180"/>
    <line x1="35" y1="180" x2="20" y2="210"/>
    <line x1="20" y1="250" x2="35" y2="280"/>
    <line x1="35" y1="280" x2="20" y2="310"/>
    <line x1="20" y1="350" x2="35" y2="380"/>
    <line x1="35" y1="380" x2="20" y2="410"/>
    <line x1="20" y1="450" x2="35" y2="480"/>
    <line x1="35" y1="480" x2="20" y2="510"/>
    <line x1="20" y1="550" x2="35" y2="580"/>
    <line x1="35" y1="580" x2="20" y2="610"/>
  </g>

  <!-- Right gantry cross-bracing -->
  <g stroke="#ffd931" stroke-width="1.5" opacity="0.6">
    <line x1="595" y1="150" x2="610" y2="180"/>
    <line x1="610" y1="180" x2="595" y2="210"/>
    <line x1="595" y1="250" x2="610" y2="280"/>
    <line x1="610" y1="280" x2="595" y2="310"/>
    <line x1="595" y1="350" x2="610" y2="380"/>
    <line x1="610" y1="380" x2="595" y2="410"/>
    <line x1="595" y1="450" x2="610" y2="480"/>
    <line x1="610" y1="480" x2="595" y2="510"/>
    <line x1="595" y1="550" x2="610" y2="580"/>
    <line x1="610" y1="580" x2="595" y2="610"/>
  </g>

  <!-- Launch pad base (layered bars) -->
  <rect x="10" y="670" width="610" height="6" fill="#9e193c" opacity="0.8"/>
  <rect x="40" y="680" width="550" height="3" fill="#f63356" opacity="0.6"/>
  <rect x="80" y="688" width="470" height="2" fill="#ffd931" opacity="0.5"/>
</svg>
