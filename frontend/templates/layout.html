<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=1920, height=1080, initial-scale=1"
        />
        <title>{{ active.ROCKET_NAME }} - RMIT High Velocity</title>
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/tailwind.css"
            media="screen"
        />
        <style>
            {{ active.CSS }}
        </style>
        {% for stylesheet in active.STYLESHEETS %}
        <link
            rel="stylesheet"
            type="text/css"
            href="{{stylesheet}}"
            media="screen"
        />
        {% endfor %}
    </head>

    <body
        class="{{name}} max-w-screen max-h-screen w-screen h-screen flex flex-col overflow-hidden"
    >
        <!-- Main body grid, size is dynamically allocated depending on the config -->
        <!-- For Legacy3, Atlas it's 12x12 (secretly 12x13 but the header is static) -->
        <!-- For Horizon it's 24x12, with each grid section being ~80x75 pixels -->
        <main
            class="w-full h-full grid grid-cols-{{active.GRID[0]}} grid-rows-{{active.GRID[1]}} grid-flow-col"
            id="{{active.PAGES[0]['id']}}"
        >
            {% for module in active.MODULES %} {% if
            module.split("/")[-1].split(".")[0] in active.MODULE_PAGES %}
            <div
                class="{{active.MODULE_CLASSES[module.split('/')[-1].split('.')[0]]}}"
            >
                {% include 'rockets/' ~ module %}
            </div>
            {% endif %} {% endfor %}
        </main>

        <!-- Footer with navigation buttons -->
        <!--
        <nav
            class="w-screen max-w-screen min-h-[80px] h-[80px] border border-black"
        >
            <div class="flex flex-row justify-start items-center">
                {% for page in active.PAGES %}
                <a
                    class="h-[80px] w-[80px] border-black border-2 border-collapse"
                    href="#{{page['id']}}"
                >
                    <div class="icon {{page['icon']}} w-8 h-8"></div>
                    <span>{{page['name']}}</span>
                </a>
                {% endfor %}
            </div>
        </nav>
        -->

        <!--
        I would like to eventually replace GCS_Display with code in the API 
         for registering HTML elements to data key pairs, adding those to a big
         list or something and then doing it computationally rather than hard-coding
         everything in the display.js file.

        This should vastly reduce the number of checks we need to make to see if
         HTML elements exist and also reduce the need for so much repetition and monolithy.
        -->
        <script src="/js/GCS_API.js"></script>
        <script src="/js/GCS_Display.js"></script>
        <script src="/js/GCS_Testing.js"></script>

        <script src="/js/libraries/d3.min.js"></script>
        <script src="/js/GCS_Graphs.js"></script>

        <script>
            // PAGE SWITCHING CODE
            function displaySelectModule(selected) {
                document.querySelector("main").id = selected;
            }

            if (document.querySelector("nav")) {
                // Get selected page
                var selected = window.location.hash
                    ? this.window.location.hash.substring(1)
                    : document.querySelector("nav a").href.split("#")[1];

                // Determine which modules are "selected"
                displaySelectModule(selected);

                // Highlight selected tab link
                document
                    .querySelector(`a[href='#${selected}']`)
                    .classList.add("selected");

                // Switch tabs when links are pressed
                document.querySelectorAll("nav a").forEach((elem) => {
                    elem.addEventListener("click", (event) => {
                        event.preventDefault();

                        // Switch tabs
                        selected = elem.href.split("#")[1];
                        displaySelectModule(selected);

                        // Highlight new selected tab link
                        document.querySelectorAll("nav a").forEach((elem) => {
                            elem.classList.remove("selected");
                        });
                        elem.classList.add("selected");

                        // Update URL
                        history.replaceState(null, "", `#${selected}`);

                        // Dispatch page resize event (since elements are moving around)
                        window.dispatchEvent(new Event("resize"));
                    });
                });
            }
        </script>
    </body>
</html>
