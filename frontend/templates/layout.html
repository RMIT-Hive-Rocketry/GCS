<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=1920, height=1080, initial-scale=1"
        />
        <title>{{ config.ROCKET_NAME }} - RMIT High Velocity</title>
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/tailwind.css"
            media="screen"
        />
        <style>
            {{ config.CSS }}
        </style>
    </head>

    <body
        class="legacy bg-hex w-screen h-screen max-w-screen max-h-screen text-white border-hive border-2 flex flex-col overflow-hidden"
    >
        <!-- Header visible on all pages -->
        <header
            class="w-full flex flex-row gap-2 h-24 min-h-24 max-h-24 bg-black/50"
        >
            <div class="w-3/10">{% include config.MODULE_LOGOS %}</div>
            <nav
                class="w-4/10 h-full grid grid-cols-{{config.PAGES|length}} bg-navbar px-[3%] p-2 gap-2 font-medium text-center items-center text-sm"
            >
                {% for page in config.PAGES %}
                <a href="#{{page['id']}}">
                    <div class="icon {{page['icon']}}"></div>
                    <span>{{page['name']}}</span>
                </a>
                {% endfor %}
            </nav>
            <div class="w-3/10">{% include config.MODULE_RADIO %}</div>
        </header>

        <!-- Main grid (12x12) -->
        <!-- Modules are loaded from separate files in templates/modules/ -->
        <main
            class="w-full max-w-full h-[calc(100vh-6rem)] max-h-[calc(100vh-6rem)] overflow-hidden grid grid-cols-12 grid-rows-12 grid-flow-col gap-4 px-4 py-2"
            id="{{config.PAGES[0]['id']}}"
        >
            <!-- Adjust modules in config.py -->
            {% for module in config.MODULES %}
            <div class="{{config.MODULES[module]['classes']}}">
                {% include module %}
            </div>
            {% endfor %}
        </main>

        <script src="/js/GCS_API.js"></script>
        <script src="/js/GCS_Display.js"></script>
        <script src="/js/GCS_Testing.js"></script>

        <script src="/js/libraries/d3.min.js"></script>
        <script src="/js/GCS_Graphs.js"></script>

        <script>
            // PAGE SWITCHING CODE
            function displaySelectModule(selected) {
                document.querySelector("main").id = selected;
            }

            if (document.querySelector("nav")) {
                // Get selected page
                var selected = window.location.hash
                    ? this.window.location.hash.substring(1)
                    : document.querySelector("nav a").href.split("#")[1];

                // Determine which modules are "selected"
                displaySelectModule(selected);

                // Highlight selected tab link
                document
                    .querySelector(`a[href='#${selected}']`)
                    .classList.add("selected");

                // Switch tabs when links are pressed
                document.querySelectorAll("nav a").forEach((elem) => {
                    elem.addEventListener("click", (event) => {
                        event.preventDefault();

                        // Switch tabs
                        selected = elem.href.split("#")[1];
                        displaySelectModule(selected);

                        // Highlight new selected tab link
                        document.querySelectorAll("nav a").forEach((elem) => {
                            elem.classList.remove("selected");
                        });
                        elem.classList.add("selected");

                        // Update URL
                        history.replaceState(null, "", `#${selected}`);

                        // Dispatch page resize event (since elements are moving around)
                        window.dispatchEvent(new Event("resize"));
                    });
                });
            }
        </script>
    </body>
</html>
