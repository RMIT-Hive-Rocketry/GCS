[hardware]
; Options: UART_E5, TEST, TEST_UART_E5, TCP
interface_release_av = UART_E5
interface_release_gse = TCP
interface_dev_av = TEST
interface_dev_gse = TEST

; pendant_daemon options: hybrid_device, rpi_gpio_device, f710
; pendant_emulator options: hybrid_device, rpi_gpio_device, f710, emulated_device, hid_device
; pendant_daemon options should always be controlled by a human unless you know exactly what you are doing and have permission from both current GSE and GC lead
controller = hybrid_device

; true means pendant_daemon runs, false means pendant_emulator runs
; pendant_daemon CAN send packets to the server, pendant_emulator can only send packets to the frontend api
send_pendant_state_to_server = false

[tcp]
; only used when [hardware] interface = TCP
; typically 192.168.0.150 for run
gse_ip = 192.168.0.150
; (1-65535) and not overlapping with other ports
; typically 5000 for run, 5001 for dev
gse_port = 5000

path_json_network_device_test=config/network_devices_test.json
path_json_network_device_prod=config/network_devices_prod.json

[lora]
; only used when [hardware] interface = UART_E5
serial_device = /dev/ttyUSB0

; Based off of this AT command
; AT+TEST=RFCFG,928,SF9,500,12,16,22,OFF,OFF,OFF
; AT+TEST=RFCFG,[F],[SF],[BW],[TXPR],[RXPR],[POW],[CRC],[IQ],[NET]
; From https://files.seeedstudio.com/products/317990687/res/LoRa-E5+AT+Command+Specification_V1.0+.pdf#page=53

; in MHz
frequency = 915
spread_factor = SF9
bandwidth = 500
tx_preamble = 12
rx_preamble = 16
; LF and HF max power is 22
power = 22
crc = ON
iq = OFF
net = OFF


[locks]
; Format based on OS if not needed
lock_file_gse_response_path = /tmp/gcs_await_GSE.lock
lock_file_av_response_path = /tmp/gcs_await_AV.lock

[gse_sensors]
; When false, the device emulator sends the string "offline" for that metric in the LabVIEW row.
; More information:
; RMIT ONLY: https://rmiteduau.sharepoint.com/:x:/r/sites/RMITHIVERocketTeam/Shared%20Documents/00%202026%20Competitions/IREC%202026/3.0%20Ground%20Control/daq/DAQ%20Sensors%20for%20GL.xlsx?d=w9088d352929443bb8d0e68a94ac8a5aa&csf=1&web=1&e=7MxgVF
temp_tank_top_enabled = true
temp_tank_middle_enabled = true
temp_tank_bottom_enabled = true
temp_vent_enabled = true
temp_pipe_n2o_gse_enabled = true
pressure_n2o_bottle_enabled = true
pressure_n2o_tank_enabled = true
pressure_o2_tank_enabled = true
weight_rocket_enabled = true
; *Based on suggestions in GCS-2026#50, this should be changed to .yaml in future


[emulation]
; Realistic noise at it's worst is like 0.3
noise_coefficient = 0.0
; Options: 0.0 - 1.0
packet_loss = 0.0
; If true, packet values will emulate arbitrary errors. Otherwise nominal operation
experimental = false
tcp_server_port = 2828

[logging]
; Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
; Invalid options will be silently replaced as INFO
; This is for dev and release mode
level = DEBUG
; Selected Mode For display filter on front end website
level_front = INFO
; When true, use full prefixes: [DEBUG  ] 00006.855 s | name: [STDOUT] message
; When false (e.g. release), use short: [D] 006.85 s | name: message
detailed_logging_prefix = false
cli_log_dir = logs/cli/

[frontend]
; IP address and port for the frontend, default is 0.0.0.0:8008
http_host = 0.0.0.0
http_port = 8008
; IP address and port for the API websocket, default is 0.0.0.0:8008
ws_host = 0.0.0.0
ws_port = 1887

[frontend_api]
pendant_packet_id = 10
slogger_packet_id = 40
network_diagnostics_packet_id = 50
gse_labview_tcp_packet_id = 55
  ; How often to ping network devices (seconds)
ping_interval_s = 0.1


[performance_monitor]
; Directory for performance logs
performance_log_dir = logs/performance/
; How often to sample performance for logging (seconds)
performance_sampling_interval = 1
; How often to print performance to CLI (seconds)
performance_cli_log_interval = 30
